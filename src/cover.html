<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700&family=Inter:wght@400;500;600&display=swap');
* { margin:0; box-sizing:border-box; }
html,body { width:1600px; height:2560px; }
.cover {
  width:1600px; height:2560px; position:relative; overflow:hidden;
  background:#16263d; color:#faf6ec;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-family:'Cormorant Garamond', serif;
}
.bg { position:absolute; inset:0; opacity:0.5; }
.bg img { width:100%; height:100%; object-fit:cover; }
.inner { position:relative; z-index:2; text-align:center; padding:0 160px; }
.kick { font-family:'Inter',sans-serif; font-size:34px; letter-spacing:18px; text-transform:uppercase; color:#c8a868; margin-bottom:80px; }
h1 { font-size:340px; font-weight:600; line-height:0.9; color:#faf6ec; letter-spacing:4px; }
.rule { width:120px; height:3px; background:#a9853f; margin:70px auto; }
.sub { font-style:italic; font-size:54px; line-height:1.4; color:#e7dcc3; max-width:1100px; margin:0 auto; }
.author { font-family:'Inter',sans-serif; font-size:40px; letter-spacing:12px; text-transform:uppercase; position:absolute; bottom:300px; left:0; right:0; text-align:center; z-index:2; }
.edition { font-family:'Inter',sans-serif; font-size:26px; letter-spacing:10px; text-transform:uppercase; color:#c8a868; position:absolute; bottom:230px; left:0; right:0; text-align:center; z-index:2; }
</style>
</head>
<body>
<div class="cover">
  <div class="bg"><img src="../assets/part-opener-1.svg" alt=""></div>
  <div class="inner">
    <div class="kick">Spinoza · 2026</div>
    <h1>Ética</h1>
    <div class="rule"></div>
    <p class="sub">uma leitura moderna da obra que dissolveu a fronteira entre Deus e a Natureza</p>
  </div>
  <div class="author">Benedictus de Spinoza</div>
  <div class="edition">Edição modernizada</div>
</div>
</body>
</html>
