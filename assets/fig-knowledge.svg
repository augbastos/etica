<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420"><rect x="60" y="330" width="170" height="50" fill="none" stroke="#16263d" stroke-width="1.4" opacity="0.9"/><text x="145.0" y="356" text-anchor="middle" fill="#16263d" font-family="Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="1">1º · IMAGINAÇÃO</text><text x="145.0" y="376" text-anchor="middle" fill="#6c6555" font-family="Cormorant Garamond, serif" font-size="12" font-style="italic">opinião, ouvir dizer</text><rect x="230" y="250" width="170" height="130" fill="none" stroke="#16263d" stroke-width="1.4" opacity="0.9"/><text x="315.0" y="276" text-anchor="middle" fill="#16263d" font-family="Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="1">2º · RAZÃO</text><text x="315.0" y="296" text-anchor="middle" fill="#6c6555" font-family="Cormorant Garamond, serif" font-size="12" font-style="italic">noções comuns, ciência</text><rect x="400" y="170" width="170" height="210" fill="#16263d" stroke="#16263d" stroke-width="1.4" opacity="1"/><text x="485.0" y="196" text-anchor="middle" fill="#faf6ec" font-family="Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="1">3º · INTUIÇÃO</text><text x="485.0" y="216" text-anchor="middle" fill="#c8a868" font-family="Cormorant Garamond, serif" font-size="12" font-style="italic">ver as coisas em Deus</text><text x="485.0" y="150" text-anchor="middle" fill="#a9853f" font-family="Cormorant Garamond, serif" font-size="15" font-style="italic">→ beatitude</text><text x="310.0" y="404" text-anchor="middle" fill="#6c6555" font-family="Inter, sans-serif" font-size="11">quanto mais alto o conhecimento, mais a mente repousa no amor intelectual de Deus</text></svg>